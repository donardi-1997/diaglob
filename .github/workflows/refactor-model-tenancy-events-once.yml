name: One-off Model Tenancy Listener Extraction

on:
  push:
    branches:
      - refactor/model-tenancy-domain
    paths:
      - scripts/refactor_model_tenancy_events_once.py
      - .github/workflows/refactor-model-tenancy-events-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/model-tenancy-domain
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Move Store listeners into tenancy domain
        run: python scripts/refactor_model_tenancy_events_once.py
      - name: Commit rewrite
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/model_domains/tenancy.py backend/app/models.py
          git commit -m "refactor: move store lifecycle listeners into tenancy"
          git fetch origin refactor/model-tenancy-domain
          git rebase origin/refactor/model-tenancy-domain
          git push origin HEAD:refactor/model-tenancy-domain
