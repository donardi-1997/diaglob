name: Billing Preview DB Cleanup

on:
  push:
    branches:
      - perf/billing-preview-db-cleanup

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Focused regression and Billing Preview suite
        working-directory: backend
        run: |
          python -m pytest -q --tb=short \
            tests/test_ci_db_fixture_scope.py \
            tests/test_billing_preview.py \
            -p tools.test_timings \
            --timings-output /tmp/billing-preview-timings.json
          cat /tmp/billing-preview-timings.json

      - name: Lint focused files
        run: |
          ruff check backend/tests/test_billing_preview.py backend/tests/test_ci_db_fixture_scope.py backend/tools/test_timings.py
          git diff --check
