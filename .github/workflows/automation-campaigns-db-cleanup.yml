name: Automation Campaigns DB Cleanup

on:
  push:
    branches:
      - perf/automation-campaigns-db-cleanup
    paths:
      - .github/workflows/automation-campaigns-db-cleanup.yml

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: perf/automation-campaigns-db-cleanup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Ruff
        if: matrix.shard == 0
        working-directory: backend
        run: ruff check app/ tests/ tools/

      - name: Select backend shard
        working-directory: backend
        run: |
          set -euo pipefail
          python -m tools.test_sharding --index "${{ matrix.shard }}" --count 2 > /tmp/backend-test-files.txt
          test -s /tmp/backend-test-files.txt
          echo "Shard ${{ matrix.shard }} test files: $(wc -l < /tmp/backend-test-files.txt)"

      - name: Backend tests
        working-directory: backend
        run: |
          set -euo pipefail
          mapfile -t test_files < /tmp/backend-test-files.txt
          python -m pytest -q --tb=short "${test_files[@]}"
