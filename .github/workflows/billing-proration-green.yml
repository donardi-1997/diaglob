name: Billing Proration Green

on:
  push:
    branches:
      - fix/billing-upgrade-proration
    paths:
      - .github/workflows/billing-proration-green.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/billing-upgrade-proration

      - name: Apply provider billing-anchor fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/services/billing_service.py")
          text = path.read_text()

          anchor_block = (
              "    next_billed_at = _build_upgrade_next_billed_at(\n"
              "        organization.billing_period_months\n"
              "    )\n"
          )
          next_billed_arg = "        next_billed_at=next_billed_at,\n"

          if text.count(anchor_block) != 2:
              raise SystemExit(
                  f"expected 2 upgrade billing-anchor blocks, found {text.count(anchor_block)}"
              )
          if text.count(next_billed_arg) != 2:
              raise SystemExit(
                  f"expected 2 upgrade next_billed_at arguments, found {text.count(next_billed_arg)}"
              )

          text = text.replace(anchor_block + "\n", "", 2)
          text = text.replace(next_billed_arg, "", 2)
          path.write_text(text)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff

      - name: Verify focused backend billing suite
        working-directory: backend
        run: |
          ruff check app/billing.py app/services/billing_service.py tests/test_billing.py tests/test_billing_upgrade_cycle.py tests/test_billing_preview.py
          python -m pytest -q --tb=short \
            tests/test_billing.py \
            tests/test_billing_upgrade_cycle.py \
            tests/test_billing_preview.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend billing contract
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit provider fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/billing_service.py
          git diff --cached --check
          git commit -m "fix: preserve provider billing anchor on upgrades"
          git push origin HEAD:fix/billing-upgrade-proration
