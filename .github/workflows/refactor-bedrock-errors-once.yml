name: One-off Bedrock Error Extraction

on:
  push:
    branches:
      - refactor/knowledge-provisioning-errors
    paths:
      - .github/workflows/refactor-bedrock-errors-once.yml

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract error boundary
        run: python3 scripts/refactor_bedrock_errors_once.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/bedrock_knowledge_base.py
          git diff --cached --quiet && exit 0
          git commit -m "refactor: delegate Bedrock error handling"
          git push origin HEAD:${GITHUB_REF_NAME}
