name: One-time OAuth model extraction

on:
  push:
    branches:
      - refactor/extract-oauth-state-models

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-oauth-state-models
          fetch-depth: 0

      - name: Extract OAuth model block
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/app/models.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "# ============================================================\n# SHOPIFY OAUTH STATE\n# ============================================================"
          end_marker = "# ============================================================\n# PRODUCT\n# ============================================================"

          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("Expected OAuth/Product markers exactly once")

          before, remainder = text.split(start_marker, 1)
          _oauth_block, after = remainder.split(end_marker, 1)
          replacement = (
              "# OAuth state models are physically defined in app.model_domains.oauth.\n"
              "# These imports preserve the historical app.models import surface.\n"
              "from .model_domains.oauth import NuvemshopOAuthState, ShopifyOAuthState\n\n\n"
          )
          path.write_text(before + replacement + end_marker + after, encoding="utf-8")

          updated = path.read_text(encoding="utf-8")
          if "class ShopifyOAuthState(Base):" in updated or "class NuvemshopOAuthState(Base):" in updated:
              raise SystemExit("OAuth state classes were not fully removed from app.models")

      - name: Commit extraction and remove helper
        run: |
          rm .github/workflows/refactor-oauth-models-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/models.py .github/workflows/refactor-oauth-models-once.yml
          git commit -m "refactor: move OAuth state models out of monolith"
          git push origin HEAD:refactor/extract-oauth-state-models
