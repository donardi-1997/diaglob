name: Apply Payments Test Optimization

on:
  push:
    branches:
      - perf/payments-db-cleanup
    paths:
      - .github/workflows/apply-payments-test-optimization.yml

permissions:
  contents: write

jobs:
  apply-profile-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/payments-db-cleanup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Apply Payments fixture optimization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/test_payments.py")
          text = path.read_text(encoding="utf-8")
          old = '''@pytest.fixture(autouse=True)\ndef setup_db():\n    Base.metadata.create_all(bind=engine)\n    yield\n    Base.metadata.drop_all(bind=engine)\n\n\n@pytest.fixture\ndef db():\n'''
          new = '''@pytest.fixture(scope="module", autouse=True)\ndef setup_db():\n    Base.metadata.drop_all(bind=engine)\n    Base.metadata.create_all(bind=engine)\n    yield\n    Base.metadata.drop_all(bind=engine)\n\n\n@pytest.fixture(autouse=True)\ndef cleanup_db():\n    yield\n    with engine.begin() as connection:\n        for table in reversed(Base.metadata.sorted_tables):\n            connection.execute(table.delete())\n\n\n@pytest.fixture\ndef db():\n'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one Payments fixture block")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Verify fixture regression
        working-directory: backend
        run: python -m pytest -q --tb=short tests/test_ci_db_fixture_scope.py

      - name: Profile Payments tests
        working-directory: backend
        run: |
          python -m pytest -q --tb=short \
            -p tools.test_timings \
            --timings-output=/tmp/payments-timings.json \
            tests/test_payments.py
          echo "=== PAYMENTS TIMING ==="
          cat /tmp/payments-timings.json

      - name: Update Payments timing profile
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          profile_path = Path("backend/test_timings.json")
          measured_path = Path("/tmp/payments-timings.json")
          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          measured = json.loads(measured_path.read_text(encoding="utf-8"))
          key = "tests/test_payments.py"
          if set(measured) != {key}:
              raise SystemExit(f"unexpected timing keys: {sorted(measured)}")
          profile[key] = measured[key]
          profile_path.write_text(
              json.dumps(profile, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"{key}: {profile[key]:.6f}s")
          PY

      - name: Commit verified optimization
        run: |
          git config user.name "Adrian Felipe Guerra"
          git config user.email "adrianguerra9703@gmail.com"
          git add backend/tests/test_payments.py backend/test_timings.json
          git commit -m "perf: reuse Payments test schema"
          git push origin HEAD:perf/payments-db-cleanup
