name: Profile Backend Test Timings

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/profile-backend-timings.yml"

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Profile backend tests
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short -p tools.test_timings --timings-output test_timings.json
          echo "=== TEST_TIMINGS_JSON_START ==="
          cat test_timings.json
          echo "=== TEST_TIMINGS_JSON_END ==="
