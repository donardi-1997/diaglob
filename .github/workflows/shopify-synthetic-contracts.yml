name: Shopify Synthetic Contract Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopify-synthetic-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Shopify backend contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Execute synthetic Shopify security, commerce and privacy regression matrix
        working-directory: backend
        run: |
          python -m pytest -q --tb=short --junitxml=../shopify-backend-junit.xml \
            tests/test_shopify_oauth_crypto_matrix.py \
            tests/test_shopify_graphql_transport_matrix.py \
            tests/test_shopify_privacy_pilot_contract_matrix.py \
            tests/test_shopify_order_webhook_integrity_matrix.py \
            tests/test_shopify_checkout_reference_safety.py \
            tests/test_shopify_protected_access_denials.py \
            tests/test_shopify_billing_verification.py \
            tests/test_shopify_compliance_webhooks.py \
            tests/test_shopify_managed_onboarding.py
      - name: Upload synthetic backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopify-backend-junit
          path: shopify-backend-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Shopify frontend and build contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests (includes Shopify, billing, workspace and stores)
        working-directory: frontend
        run: npm test
      - name: Static typecheck and production bundle
        working-directory: frontend
        run: npm run build

# This workflow never loads Shopify Partner, merchant or production credentials.
# It does not call Shopify Admin, create orders, charge cards, or erase records.
