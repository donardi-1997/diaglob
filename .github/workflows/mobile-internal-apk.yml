name: Build Diaglob Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-internal-apk.yml"

permissions:
  contents: read

concurrency:
  group: mobile-internal-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android project
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_API_URL: "https://api.diaglob.tech"
          EXPO_PUBLIC_AWS_REGION: "us-east-2"
          EXPO_PUBLIC_COGNITO_CLIENT_ID: "7gas2mvvovukjpk05jhbku4303"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: "https://api.diaglob.tech"
          EXPO_PUBLIC_AWS_REGION: "us-east-2"
          EXPO_PUBLIC_COGNITO_CLIENT_ID: "7gas2mvvovukjpk05jhbku4303"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify embedded JavaScript bundle
        shell: bash
        run: |
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q "assets/index.android.bundle"
          echo "Standalone JS bundle is embedded in the APK."

      - name: Prepare artifact
        shell: bash
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
            mobile/diaglob-mobile-v0.1.1-standalone.apk
          sha256sum mobile/diaglob-mobile-v0.1.1-standalone.apk \
            > mobile/diaglob-mobile-v0.1.1-standalone.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: diaglob-mobile-v0.1.1-standalone
          path: |
            mobile/diaglob-mobile-v0.1.1-standalone.apk
            mobile/diaglob-mobile-v0.1.1-standalone.apk.sha256
          retention-days: 14
          if-no-files-found: error
