name: One-time Google integration model extraction

on:
  push:
    branches:
      - refactor/extract-google-integration-models

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-google-integration-models
          fetch-depth: 0
      - name: Extract Google integration models safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/models.py')
          text = path.read_text()
          start_marker = '# ============================================================\n# GOOGLE INTEGRATION\n# ============================================================\n'
          end_marker = '# ============================================================\n# PAYMENT MODELS\n# ============================================================\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Expected exactly one Google and payment marker')
          start = text.index(start_marker)
          end = text.index(end_marker)
          block = text[start + len(start_marker):end].strip()
          if 'class GoogleOAuthState' not in block or 'class GoogleConnection' not in block:
              raise SystemExit('Google model classes not found in extraction block')
          if block.count('class ') != 2:
              raise SystemExit(f'Unexpected class count in Google block: {block.count("class ")}')

          target = Path('backend/app/model_domains/google.py')
          target.write_text(
              '"""Google integration persistence models.\n\n'
              'Physically extracted from the legacy ``app.models`` monolith while\n'
              'keeping the shared SQLAlchemy ``Base`` metadata unchanged.\n'
              '"""\n\n'
              'from datetime import datetime\n\n'
              'from sqlalchemy import Boolean, DateTime, ForeignKey, Integer, String, Text, UniqueConstraint\n'
              'from sqlalchemy.orm import Mapped, mapped_column\n\n'
              'from ..db import Base\n\n\n'
              + block + '\n'
          )

          replacement = (
              '# Google integration models are physically defined in app.model_domains.google.\n'
              '# These imports preserve the historical app.models import surface.\n'
              'from .model_domains.google import GoogleConnection, GoogleOAuthState\n\n\n'
          )
          path.write_text(text[:start] + replacement + text[end:])
          PY

          rm .github/workflows/refactor-google-models-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/models.py backend/app/model_domains/google.py .github/workflows/refactor-google-models-once.yml
          git commit -m "refactor: physically extract Google integration models"
          git push origin HEAD:refactor/extract-google-integration-models
