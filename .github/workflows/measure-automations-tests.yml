name: Measure Automations Tests

on:
  push:
    branches:
      - perf/automations-test-fixture
    paths:
      - .github/workflows/measure-automations-tests.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/automations-test-fixture

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff

      - name: Measure automations tests
        working-directory: backend
        run: |
          set -euo pipefail
          ruff check tests/test_automations.py tests/test_ci_db_fixture_scope.py
          python -m pytest -q --tb=short tests/test_ci_db_fixture_scope.py
          echo "=== AUTOMATIONS ==="
          python -m pytest -q --tb=short tests/test_automations.py
