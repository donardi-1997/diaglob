name: One-off Trial Hardening

on:
  push:
    branches:
      - feature/merchant-trial-anti-abuse
    paths:
      - .github/workflows/harden-trial-once.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hardening
        run: python3 scripts/harden_trial_once.py
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/ai_usage_service.py backend/app/services/shopify_service.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden merchant trial edge cases"
          git push origin HEAD:${GITHUB_REF_NAME}
