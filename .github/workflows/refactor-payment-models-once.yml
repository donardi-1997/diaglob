name: One-time payment model extraction

on:
  push:
    branches:
      - refactor/extract-payment-models
    paths:
      - .github/workflows/refactor-payment-models-once.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace payment model block with compatibility imports
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/models.py")
          text = path.read_text()
          marker = "# ============================================================\n# PAYMENT MODELS\n# ============================================================\n"
          if text.count(marker) != 1:
              raise SystemExit(f"Expected exactly one payment marker, found {text.count(marker)}")

          prefix, _ = text.split(marker, 1)
          replacement = (
              "# Payment models are physically defined in app.model_domains.payments.\n"
              "# These imports preserve the historical app.models import surface.\n"
              "from .model_domains.payments import PaymentConnection, PaymentTransaction\n"
          )
          path.write_text(prefix.rstrip() + "\n\n\n" + replacement)
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/refactor-payment-models-once.yml

      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/models.py .github/workflows/refactor-payment-models-once.yml
          git commit -m "refactor: remove payment models from legacy monolith"
          git push
