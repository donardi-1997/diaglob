name: Apply Bedrock Google Test Optimization

on:
  push:
    branches:
      - perf/bedrock-google-db-cleanup
    paths:
      - .github/workflows/apply-bedrock-google-db-cleanup.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/bedrock-google-db-cleanup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Apply fixture optimization
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("backend/tests/test_bedrock_knowledge_base.py"): (
                  '''@pytest.fixture\ndef setup_database():\n    Base.metadata.create_all(bind=engine)\n    yield\n    Base.metadata.drop_all(bind=engine)\n\n\n@pytest.fixture\ndef db(setup_database):\n''',
                  '''@pytest.fixture(scope="module", autouse=True)\ndef setup_database():\n    Base.metadata.drop_all(bind=engine)\n    Base.metadata.create_all(bind=engine)\n    yield\n    Base.metadata.drop_all(bind=engine)\n\n\n@pytest.fixture(autouse=True)\ndef cleanup_db(setup_database):\n    yield\n    with engine.begin() as connection:\n        for table in reversed(Base.metadata.sorted_tables):\n            connection.execute(table.delete())\n\n\n@pytest.fixture\ndef db():\n''',
              ),
              Path("backend/tests/test_google_sheets.py"): (
                  '''@pytest.fixture()\ndef setup_db():\n    Base.metadata.create_all(bind=engine)\n    yield\n    Base.metadata.drop_all(bind=engine)\n\n\n@pytest.fixture()\ndef db(setup_db):\n''',
                  '''@pytest.fixture(scope="module", autouse=True)\ndef setup_db():\n    Base.metadata.drop_all(bind=engine)\n    Base.metadata.create_all(bind=engine)\n    yield\n    Base.metadata.drop_all(bind=engine)\n\n\n@pytest.fixture(autouse=True)\ndef cleanup_db(setup_db):\n    yield\n    with engine.begin() as connection:\n        for table in reversed(Base.metadata.sorted_tables):\n            connection.execute(table.delete())\n\n\n@pytest.fixture()\ndef db():\n''',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one fixture block in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Verify regression contract
        working-directory: backend
        run: python -m pytest -q --tb=short tests/test_ci_db_fixture_scope.py

      - name: Measure Bedrock tests
        working-directory: backend
        run: |
          start=$(python -c 'import time; print(time.monotonic())')
          python -m pytest -q --tb=short tests/test_bedrock_knowledge_base.py
          end=$(python -c 'import time; print(time.monotonic())')
          python -c "print(f'BEDROCK_ELAPSED={float(\"$end\")-float(\"$start\"):.3f}s')"

      - name: Measure Google Sheets tests
        working-directory: backend
        run: |
          start=$(python -c 'import time; print(time.monotonic())')
          python -m pytest -q --tb=short tests/test_google_sheets.py
          end=$(python -c 'import time; print(time.monotonic())')
          python -c "print(f'GOOGLE_SHEETS_ELAPSED={float(\"$end\")-float(\"$start\"):.3f}s')"

      - name: Commit verified changes
        run: |
          git config user.name "Adrian Felipe Guerra"
          git config user.email "adrianguerra9703@gmail.com"
          git add backend/tests/test_bedrock_knowledge_base.py backend/tests/test_google_sheets.py
          git commit -m "perf: reuse schemas in Bedrock and Google tests"
          git push origin HEAD:perf/bedrock-google-db-cleanup
