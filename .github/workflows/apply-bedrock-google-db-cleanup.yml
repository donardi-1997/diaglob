name: Profile Bedrock Google Test Optimization

on:
  push:
    branches:
      - perf/bedrock-google-db-cleanup
    paths:
      - .github/workflows/apply-bedrock-google-db-cleanup.yml

permissions:
  contents: write

jobs:
  profile-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/bedrock-google-db-cleanup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Profile optimized modules
        working-directory: backend
        run: |
          python -m pytest -q --tb=short \
            -p tools.test_timings \
            --timings-output=/tmp/optimized-timings.json \
            tests/test_bedrock_knowledge_base.py \
            tests/test_google_sheets.py
          echo "=== OPTIMIZED TIMINGS ==="
          cat /tmp/optimized-timings.json

      - name: Update checked-in timing profile
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          profile_path = Path("backend/test_timings.json")
          measured_path = Path("/tmp/optimized-timings.json")
          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          measured = json.loads(measured_path.read_text(encoding="utf-8"))
          expected = {
              "tests/test_bedrock_knowledge_base.py",
              "tests/test_google_sheets.py",
          }
          if set(measured) != expected:
              raise SystemExit(f"unexpected timing keys: {sorted(measured)}")
          profile.update(measured)
          profile_path.write_text(
              json.dumps(profile, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          for path in sorted(expected):
              print(f"{path}: {profile[path]:.6f}s")
          PY

      - name: Commit timing profile
        run: |
          git config user.name "Adrian Felipe Guerra"
          git config user.email "adrianguerra9703@gmail.com"
          git add backend/test_timings.json
          git commit -m "test: refresh Bedrock and Google timings"
          git push origin HEAD:perf/bedrock-google-db-cleanup
