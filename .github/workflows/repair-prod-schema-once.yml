name: Repair Production Schema Once

on:
  push:
    branches:
      - fix/dashboard-network-error

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY_B64: ${{ secrets.PROD_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$PROD_SSH_KEY_B64" | base64 --decode > ~/.ssh/diaglob_actions_prod
          chmod 600 ~/.ssh/diaglob_actions_prod
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Apply pending production migrations and verify schema
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/diaglob_actions_prod "$PROD_USER@$PROD_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          set -a
          . /etc/diaglob/diaglob.env
          set +a
          cd /opt/diaglob/app/backend

          echo '=== BEFORE ==='
          .venv/bin/alembic current

          echo '=== APPLYING MIGRATIONS ==='
          .venv/bin/alembic upgrade heads

          echo '=== AFTER ==='
          .venv/bin/alembic current

          echo '=== VERIFY SCHEMA ==='
          .venv/bin/python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          from app.db_config import DATABASE_URL

          engine = create_engine(DATABASE_URL)
          insp = inspect(engine)
          required_columns = {
              'products': {'cost'},
              'order_items': {'unit_cost'},
              'orders': {'lifecycle_status', 'lifecycle_synced_at'},
          }
          for table, required in required_columns.items():
              existing = {c['name'] for c in insp.get_columns(table)}
              missing = required - existing
              if missing:
                  raise SystemExit(f'{table} missing columns: {sorted(missing)}')
              print(f'{table}: required columns OK')

          for table in ('payment_connections', 'payment_transactions', 'telegram_connections'):
              if not insp.has_table(table):
                  raise SystemExit(f'missing table: {table}')
              print(f'{table}: exists')

          with engine.connect() as conn:
              versions = [row[0] for row in conn.execute(text('select version_num from alembic_version order by version_num'))]
          print('alembic_version_rows=', versions)
          if set(versions) != {'9fb2e4283c46', 'd7e8f9a0b1c2'}:
              raise SystemExit(f'unexpected Alembic heads: {versions}')
          PY

          echo '=== HEALTH ==='
          curl --fail --silent --show-error https://api.diaglob.tech/health
          echo
          REMOTE

      - name: Remove one-time repair workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-prod-schema-once.yml
          git commit -m "chore: remove one-time production schema repair workflow"
          git pull --rebase origin fix/dashboard-network-error
          git push origin HEAD:fix/dashboard-network-error
