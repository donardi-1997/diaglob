name: One-off Knowledge Provisioning Cleanup Refactor

on:
  push:
    branches:
      - refactor/knowledge-provisioning-cleanup
    paths:
      - .github/workflows/refactor-knowledge-cleanup-once.yml

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract modern cleanup coordination
        run: python3 scripts/refactor_knowledge_cleanup_once.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/bedrock_knowledge_base.py
          git diff --cached --quiet && exit 0
          git commit -m "refactor: delegate modern knowledge cleanup"
          git push origin HEAD:${GITHUB_REF_NAME}
