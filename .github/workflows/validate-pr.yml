name: Validate Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Backend + Frontend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Ruff
        working-directory: backend
        run: ruff check app/ tests/

      - name: Generate runtime route snapshot artifact
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tests.test_route_contract import _get_runtime_routes

          path = Path('/tmp/api_routes.json')
          path.write_text(json.dumps(_get_runtime_routes(), indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload runtime route snapshot
        uses: actions/upload-artifact@v4
        with:
          name: api-routes-runtime
          path: /tmp/api_routes.json
          if-no-files-found: error

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q --tb=short

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build
