name: Validate Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed scopes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      mobile: ${{ steps.scope.outputs.mobile }}
      automation_e2e: ${{ steps.scope.outputs.automation_e2e }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate E2E PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/e2e-preflight.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/e2e-block-a.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Detect backend and frontend changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          backend=false
          frontend=false
          mobile=false
          automation_e2e=false

          while IFS= read -r file; do
            case "$file" in
              backend/*|scripts/check-api-readiness.sh|scripts/restart-api-verified.sh|scripts/tests/*|scripts/*shopify*.py)
                backend=true
                ;;
              shopify.app.toml|shopify/*)
                backend=true
                frontend=true
                ;;
              frontend/*)
                frontend=true
                ;;
              mobile/*)
                mobile=true
                ;;
              .github/workflows/*.yml)
                backend=true
                frontend=true
                mobile=true
                ;;
            esac
          done <<< "$files"

          while IFS= read -r file; do
            case "$file" in
              frontend/e2e/*|frontend/src/pages/AutomationsPage.tsx|frontend/src/pages/AutomationsOverview.tsx|frontend/src/components/AutomationTemplates.tsx|frontend/src/components/automation-flows/*|frontend/src/utils/automationTemplateFlow.ts|backend/app/automation_flow_graph.py|backend/app/services/automation_flows_service.py|backend/app/api/automations.py|.github/workflows/validate-pr.yml)
                automation_e2e=true
                ;;
            esac
          done <<< "$files"

          echo "automation_e2e=$automation_e2e" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"

          echo "Backend validation required: $backend"
          echo "Frontend validation required: $frontend"
          echo "Mobile validation required: $mobile"

  backend:
    name: Backend validation (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Validate production readiness helpers
        if: matrix.shard == 0
        shell: bash
        run: |
          bash -n scripts/check-api-readiness.sh scripts/restart-api-verified.sh
          python3 -m unittest discover -s scripts/tests -p 'test_api_readiness.py'

      - name: Ruff
        if: matrix.shard == 0
        working-directory: backend
        run: ruff check app/ tests/ tools/

      - name: Shopify review source preflight
        if: matrix.shard == 0
        working-directory: backend
        run: python -m tools.shopify_review_source_preflight --config ../shopify.app.toml

      - name: Select backend test shard
        working-directory: backend
        run: |
          set -euo pipefail
          python -m tools.test_sharding --index "${{ matrix.shard }}" --count 2 > /tmp/backend-test-files.txt
          test -s /tmp/backend-test-files.txt
          echo "Shard ${{ matrix.shard }} test files: $(wc -l < /tmp/backend-test-files.txt)"

      - name: Report backend timing balance
        if: matrix.shard == 0
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.test_sharding import assign_shards, discover_test_files, load_timings

          timings = load_timings(Path("test_timings.json"))
          weighted = discover_test_files(timings=timings)
          weights = dict(weighted)
          shards = assign_shards(weighted, 2)

          covered = sum(1 for path, _ in weighted if path in timings)
          print(f"Historical timing coverage: {covered}/{len(weighted)} files")
          for index, files in enumerate(shards):
              total = sum(weights[path] for path in files)
              print(f"Shard {index}: {len(files)} files, estimated {total:.3f}s")

          print("Slowest 20 backend test files:")
          for path, duration in sorted(timings.items(), key=lambda item: (-item[1], item[0]))[:20]:
              print(f"  {duration:8.3f}s  {path}")
          PY

      - name: Backend tests
        working-directory: backend
        run: |
          set -euo pipefail
          mapfile -t test_files < /tmp/backend-test-files.txt
          # Tests use in-memory SQLite per process, so xdist workers are isolated.
          # loadfile keeps each module on one worker in file order (module-scoped fixtures).
          python -m pytest -q --tb=short -n auto --dist loadfile "${test_files[@]}"

  frontend:
    name: Frontend validation
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  automation_browser:
    name: Automation Playwright E2E (desktop + mobile)
    needs: changes
    if: needs.changes.outputs.automation_e2e == 'true'
    # Playwright 1.55 browser dependencies target Ubuntu 24.04, not 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install pinned browser test runner
        working-directory: frontend/e2e
        run: npm install --no-audit --no-fund

      # Browser binaries are pinned by @playwright/test in e2e/package.json.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/e2e/package.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend/e2e
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend/e2e
        run: npx playwright install-deps chromium

      - name: Test automation journeys in real browsers
        working-directory: frontend/e2e
        run: npm test

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: automation-playwright-evidence
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  mobile:
    name: Mobile validation
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Mobile typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Mobile Android bundle
        working-directory: mobile
        run: npm run export:android

  validate:
    name: Backend + Frontend + Mobile validation
    if: always()
    needs: [changes, backend, frontend, mobile, automation_browser]
    runs-on: ubuntu-latest

    steps:
      - name: Verify validation results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          AUTOMATION_E2E_RESULT: ${{ needs.automation_browser.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          for result in "$BACKEND_RESULT" "$FRONTEND_RESULT" "$MOBILE_RESULT" "$AUTOMATION_E2E_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Validation job failed or was cancelled: $result"
              exit 1
            fi
          done

          echo "Relevant validation jobs passed."
