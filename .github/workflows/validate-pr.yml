name: Validate Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed scopes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend and frontend changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          backend=false
          frontend=false

          while IFS= read -r file; do
            case "$file" in
              backend/*)
                backend=true
                ;;
              frontend/*)
                frontend=true
                ;;
              .github/workflows/validate-pr.yml)
                backend=true
                frontend=true
                ;;
            esac
          done <<< "$files"

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

          echo "Backend validation required: $backend"
          echo "Frontend validation required: $frontend"

  backend:
    name: Backend validation (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Ruff
        if: matrix.shard == 0
        working-directory: backend
        run: ruff check app/ tests/ tools/

      - name: Select backend test shard
        working-directory: backend
        run: |
          set -euo pipefail
          python -m tools.test_sharding --index "${{ matrix.shard }}" --count 2 > /tmp/backend-test-files.txt
          test -s /tmp/backend-test-files.txt
          echo "Shard ${{ matrix.shard }} test files: $(wc -l < /tmp/backend-test-files.txt)"

      - name: Report backend timing balance
        if: matrix.shard == 0
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.test_sharding import assign_shards, discover_test_files, load_timings

          timings = load_timings(Path("test_timings.json"))
          weighted = discover_test_files(timings=timings)
          weights = dict(weighted)
          shards = assign_shards(weighted, 2)

          covered = sum(1 for path, _ in weighted if path in timings)
          print(f"Historical timing coverage: {covered}/{len(weighted)} files")
          for index, files in enumerate(shards):
              total = sum(weights[path] for path in files)
              print(f"Shard {index}: {len(files)} files, estimated {total:.3f}s")

          print("Slowest 20 backend test files:")
          for path, duration in sorted(timings.items(), key=lambda item: (-item[1], item[0]))[:20]:
              print(f"  {duration:8.3f}s  {path}")
          PY

      - name: Backend tests
        working-directory: backend
        run: |
          set -euo pipefail
          mapfile -t test_files < /tmp/backend-test-files.txt
          python -m pytest -q --tb=short "${test_files[@]}"

  frontend:
    name: Frontend validation
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  validate:
    name: Backend + Frontend validation
    if: always()
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Verify validation results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          for result in "$BACKEND_RESULT" "$FRONTEND_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Validation job failed or was cancelled: $result"
              exit 1
            fi
          done

          echo "Relevant validation jobs passed."
