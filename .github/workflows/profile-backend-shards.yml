name: Profile Backend Shards

on:
  push:
    branches:
      - perf/shopify-test-db-cleanup
    paths:
      - .github/workflows/profile-backend-shards.yml

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/shopify-test-db-cleanup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Profile shard
        working-directory: backend
        run: |
          set -euo pipefail
          python -m tools.test_sharding --index "${{ matrix.shard }}" --count 2 > /tmp/backend-test-files.txt
          mapfile -t test_files < /tmp/backend-test-files.txt
          python -m pytest -q --tb=short -p tools.test_timings --timings-output="/tmp/shard-${{ matrix.shard }}-timings.json" "${test_files[@]}"
          echo "=== SHARD ${{ matrix.shard }} TIMINGS ==="
          cat "/tmp/shard-${{ matrix.shard }}-timings.json"
