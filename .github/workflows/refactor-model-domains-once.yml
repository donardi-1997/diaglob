name: One-off Customer Model Extraction

on:
  push:
    branches:
      - refactor/model-domains-customers
    paths:
      - .github/workflows/refactor-model-domains-once.yml

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract customer models
        run: python3 scripts/refactor_customer_models_once.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/models.py backend/app/model_domains/customers.py
          git diff --cached --quiet && exit 0
          git commit -m "refactor: extract customer models domain"
          git push origin HEAD:${GITHUB_REF_NAME}
