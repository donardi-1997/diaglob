name: One-off Knowledge Runtime Extraction

on:
  push:
    branches:
      - refactor/knowledge-runtime-boundary
    paths:
      - scripts/refactor_knowledge_runtime_once.py
      - .github/workflows/refactor-knowledge-runtime-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/knowledge-runtime-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply facade rewrite
        run: python scripts/refactor_knowledge_runtime_once.py
      - name: Commit rewrite
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/bedrock_knowledge_base.py
          git commit -m "refactor: route knowledge runtime helpers through boundary"
          git push origin HEAD:refactor/knowledge-runtime-boundary
