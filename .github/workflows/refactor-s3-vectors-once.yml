name: One-off S3 Vectors Adapter Refactor

on:
  push:
    branches:
      - refactor/knowledge-s3-vectors-adapter
    paths:
      - .github/workflows/refactor-s3-vectors-once.yml

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delegate S3 Vectors operations
        run: python3 scripts/refactor_s3_vectors_once.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/bedrock_knowledge_base.py
          git diff --cached --quiet && exit 0
          git commit -m "refactor: delegate S3 Vectors operations"
          git push origin HEAD:${GITHUB_REF_NAME}
