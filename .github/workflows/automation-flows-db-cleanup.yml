name: Automation Flows DB Cleanup

on:
  push:
    branches:
      - perf/automation-flows-db-cleanup
    paths:
      - .github/workflows/automation-flows-db-cleanup.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: perf/automation-flows-db-cleanup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff

      - name: Apply shared Automation Flows engine
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/test_automation_flows.py')
          text = path.read_text(encoding='utf-8')
          old = '''@pytest.fixture()
def db():
    engine = create_engine("sqlite://", connect_args={"check_same_thread": False}, poolclass=StaticPool)
    Base.metadata.create_all(engine)
    session = sessionmaker(bind=engine)()
    org = Organization(name="Flow Org", slug="flow-org", plan="starter", subscription_status="active")
    session.add(org)
    session.flush()
    store = Store(organization_id=org.id, name="Flow Store", slug="flow-store",
                  country_code="CO", currency="COP", timezone="America/Bogota",
                  default_language="es")
    session.add(store)
    session.flush()
    yield session, org, store
    session.close()
    Base.metadata.drop_all(engine)
'''
          new = '''@pytest.fixture(scope="module")
def flow_engine():
    engine = create_engine(
        "sqlite://",
        connect_args={"check_same_thread": False},
        poolclass=StaticPool,
    )
    Base.metadata.create_all(engine)
    yield engine
    Base.metadata.drop_all(engine)


def _clear_flow_db_rows(engine):
    with engine.begin() as connection:
        for table in reversed(Base.metadata.sorted_tables):
            connection.execute(table.delete())


@pytest.fixture()
def db(flow_engine):
    session = sessionmaker(bind=flow_engine)()
    org = Organization(name="Flow Org", slug="flow-org", plan="starter", subscription_status="active")
    session.add(org)
    session.flush()
    store = Store(organization_id=org.id, name="Flow Store", slug="flow-store",
                  country_code="CO", currency="COP", timezone="America/Bogota",
                  default_language="es")
    session.add(store)
    session.flush()
    yield session, org, store
    session.close()
    _clear_flow_db_rows(flow_engine)
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected original db fixture once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Focused GREEN and timing collection
        working-directory: backend
        run: |
          python -m pytest -q --tb=short \
            tests/test_ci_db_fixture_scope.py \
            tests/test_automation_flows.py \
            -p tools.test_timings \
            --timings-output /tmp/automation-flows-timings.json
          cat /tmp/automation-flows-timings.json

      - name: Refresh Automation Flows timing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          measured = json.loads(Path('/tmp/automation-flows-timings.json').read_text())
          key = 'tests/test_automation_flows.py'
          if key not in measured:
              raise SystemExit(f'{key} missing from timing collector output')

          path = Path('backend/test_timings.json')
          timings = json.loads(path.read_text())
          old = timings[key]
          timings[key] = measured[key]
          path.write_text(json.dumps(timings, indent=2, sort_keys=True) + '\n')
          print(f'{key}: {old:.6f}s -> {timings[key]:.6f}s')
          PY

      - name: Verify focused diff
        run: |
          ruff check backend/tests/test_automation_flows.py backend/tests/test_ci_db_fixture_scope.py backend/tools/test_timings.py
          git diff --check

      - name: Commit GREEN implementation
        run: |
          git config user.name "Adrian Felipe Guerra"
          git config user.email "adrianguerra9703@gmail.com"
          git add backend/tests/test_automation_flows.py backend/test_timings.json
          git commit -m "perf: reuse DB engine in Automation Flows tests"
          git push origin HEAD:perf/automation-flows-db-cleanup
