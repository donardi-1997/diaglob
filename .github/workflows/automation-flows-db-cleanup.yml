name: Automation Flows DB Cleanup

on:
  push:
    branches:
      - perf/automation-flows-db-cleanup
    paths:
      - .github/workflows/automation-flows-db-cleanup.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: perf/automation-flows-db-cleanup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Verify RED
        working-directory: backend
        run: |
          python -m pytest -q --tb=short \
            tests/test_ci_db_fixture_scope.py \
            tests/test_automation_flows.py
