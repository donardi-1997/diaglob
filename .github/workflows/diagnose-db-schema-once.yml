name: Diagnose DB Schema Once

on:
  push:
    branches:
      - fix/dashboard-network-error

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY_B64: ${{ secrets.PROD_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$PROD_SSH_KEY_B64" | base64 --decode > ~/.ssh/diaglob_actions_prod
          chmod 600 ~/.ssh/diaglob_actions_prod
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect Alembic and schema state
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/diaglob_actions_prod "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd /opt/diaglob/app/backend
          echo '=== ALEMBIC CURRENT ==='
          .venv/bin/alembic current
          echo '=== ALEMBIC HEADS ==='
          .venv/bin/alembic heads
          echo '=== SCHEMA CONTRACT ==='
          .venv/bin/python - <<'PY'
          from sqlalchemy import create_engine, inspect
          from app.config import settings

          engine = create_engine(settings.database_url)
          insp = inspect(engine)
          checks = {
              'products': ['cost'],
              'order_items': ['unit_cost'],
              'orders': ['lifecycle_status', 'lifecycle_synced_at'],
          }
          for table, expected in checks.items():
              existing = {c['name'] for c in insp.get_columns(table)}
              print(table, {name: (name in existing) for name in expected})
          PY
          echo '=== OPERATIONS SUMMARY LOGS ==='
          sudo journalctl -u diaglob-api --since '30 minutes ago' --no-pager | grep -E 'operations/summary|UndefinedColumn|ProgrammingError' | tail -n 120 || true
          REMOTE
      - name: Remove one-time workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-db-schema-once.yml
          git commit -m "chore: remove one-time DB schema diagnostic workflow"
          git pull --rebase origin fix/dashboard-network-error
          git push origin HEAD:fix/dashboard-network-error
