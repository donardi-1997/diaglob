name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: diaglob-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff lint
        run: |
          cd backend
          ruff check app/ tests/

      - name: Backend tests
        run: |
          cd backend
          python -m pytest -q --tb=short

      - name: Frontend build
        run: |
          cd frontend
          npm ci
          npm run build

  deploy:
    name: Deploy DIAGLOB Production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY_B64: ${{ secrets.PROD_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$PROD_SSH_KEY_B64" | base64 --decode > ~/.ssh/diaglob_actions_prod
          chmod 600 ~/.ssh/diaglob_actions_prod

          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            "echo GITHUB_ACTIONS_SSH_OK"

      - name: Deploy DIAGLOB
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            "/opt/diaglob/scripts/deploy.sh"
