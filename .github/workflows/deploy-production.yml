name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: diaglob-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Ruff lint
        run: |
          cd backend
          ruff check app/ tests/

      - name: Backend tests
        run: |
          cd backend
          python -m pytest -q --tb=short

      - name: Frontend validation
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test
          npm run build

  deploy:
    name: Deploy DIAGLOB Production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY_B64: ${{ secrets.PROD_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$PROD_SSH_KEY_B64" | base64 --decode > ~/.ssh/diaglob_actions_prod
          chmod 600 ~/.ssh/diaglob_actions_prod

          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            "echo GITHUB_ACTIONS_SSH_OK"

      - name: Deploy DIAGLOB
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            "/opt/diaglob/scripts/deploy.sh"

      - name: Migrate production database
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          set -a
          . /etc/diaglob/diaglob.env
          set +a

          cd /opt/diaglob/app/backend
          .venv/bin/alembic upgrade heads
          .venv/bin/alembic current

          systemctl restart diaglob-api
          REMOTE

      - name: Verify public API health
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error https://api.diaglob.tech/health; then
              echo
              exit 0
            fi
            echo "Health check attempt ${attempt}/12 failed; retrying in 5 seconds..."
            sleep 5
          done

          echo "Production API health check failed after migrations and restart."
          exit 1

  notify:
    name: Telegram Notification
    needs:
      - validate
      - deploy
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Determine deployment status
        id: status
        shell: bash
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
            echo "status=VALIDATION FAILED" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
            echo "status=DEPLOY FAILED" >> "$GITHUB_OUTPUT"
          else
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
            echo "status=DEPLOY SUCCESSFUL" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_EMOJI: ${{ steps.status.outputs.emoji }}
          STATUS_TEXT: ${{ steps.status.outputs.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"

          MESSAGE="${STATUS_EMOJI} DIAGLOB — ${STATUS_TEXT}

          Repository: ${REPOSITORY}
          Branch: ${BRANCH}
          Commit: ${SHORT_SHA}
          Author: ${COMMIT_AUTHOR}

          ${COMMIT_MESSAGE}

          ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"

          curl --fail --silent --show-error \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
