name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: diaglob-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Ruff lint
        run: |
          cd backend
          ruff check app/ tests/

      - name: Validate readiness gate without network access
        run: |
          bash -n scripts/check-api-readiness.sh scripts/restart-api-verified.sh
          python3 -m unittest discover -s scripts/tests -p 'test_api_readiness.py'

      - name: Backend tests
        run: |
          cd backend
          python -m pytest -q --tb=short

      - name: Frontend validation
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test
          npm run build

  deploy:
    name: Deploy DIAGLOB Production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # The public readiness gate below executes from this GitHub runner.
      # Each job has a fresh filesystem; validate's checkout is not shared.
      - name: Checkout repository for readiness verification
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY_B64: ${{ secrets.PROD_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$PROD_SSH_KEY_B64" | base64 --decode > ~/.ssh/diaglob_actions_prod
          chmod 600 ~/.ssh/diaglob_actions_prod

          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            "echo GITHUB_ACTIONS_SSH_OK"

      - name: Prepare production schema before restart
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          cd /opt/diaglob/app
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          cd backend
          .venv/bin/python -c 'import sys; assert sys.version_info >= (3, 11), "Paddle SDK requires Python 3.11+ in the production virtualenv"'
          .venv/bin/pip install -r requirements.txt
          REMOTE

          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            'sudo bash -s' <<'REMOTE'
          set -euo pipefail

          ENV_FILE=/etc/diaglob/diaglob.env

          if ! grep -q '^SUPPLIER_TOKEN_ENCRYPTION_KEY=' "$ENV_FILE"; then
            SUPPLIER_KEY="$(
              /opt/diaglob/app/backend/.venv/bin/python - <<'PY'
          from cryptography.fernet import Fernet
          print(Fernet.generate_key().decode("utf-8"))
          PY
            )"
            printf '\nSUPPLIER_TOKEN_ENCRYPTION_KEY=%s\n' "$SUPPLIER_KEY" >> "$ENV_FILE"
          fi

          set -a
          . "$ENV_FILE"
          set +a

          cd /opt/diaglob/app/backend
          .venv/bin/alembic upgrade heads
          .venv/bin/alembic current
          REMOTE

      - name: Deploy DIAGLOB and verify local + public readiness
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        shell: bash
        run: |
          set -euo pipefail

          # CI concurrency serializes workflow runs. This advisory host lock
          # also coordinates with scripts/restart-api-verified.sh.
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/diaglob_actions_prod" \
            "$PROD_USER@$PROD_HOST" \
            "flock -w 120 /tmp/diaglob-production-deploy.lock /opt/diaglob/scripts/deploy.sh"
          deploy_status=$?
          set -e

          # Preserve all non-health errors as fatal. The legacy deploy.sh may
          # exit 22 when its immediate HTTPS curl sees Uvicorn warming up.
          if [[ "$deploy_status" -ne 0 && "$deploy_status" -ne 22 ]]; then
            echo "FAIL: deploy.sh returned non-health status $deploy_status" >&2
            exit "$deploy_status"
          fi

          # Do not confuse systemctl active with readiness. Validate both
          # loopback upstream and public Nginx/TLS with the same JSON contract.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/diaglob_actions_prod" \
            "$PROD_USER@$PROD_HOST" \
            "bash /opt/diaglob/app/scripts/check-api-readiness.sh"

          DIAGLOB_HEALTH_URL=https://api.diaglob.tech/health \
            DIAGLOB_READINESS_REQUIRE_SERVICE=0 \
            bash scripts/check-api-readiness.sh

          if [[ "$deploy_status" -eq 22 ]]; then
            echo "RECOVERED: deploy.sh curl raced Uvicorn startup; both readiness gates passed."
          fi

      - name: Verify production smoke surfaces
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local label="$1"
            local url="$2"
            local pattern="${3:-}"

            for attempt in {1..12}; do
              body="$(mktemp)"

              if curl                 --fail                 --location                 --silent                 --show-error                 --max-time 15                 "$url"                 --output "$body"; then
                if [[ -z "$pattern" ]] || grep -Eq "$pattern" "$body"; then
                  echo "PASS: $label ($url)"
                  rm -f "$body"
                  return 0
                fi
              fi

              rm -f "$body"
              echo "Smoke check '$label' attempt ${attempt}/12 failed; retrying in 5 seconds..."
              sleep 5
            done

            echo "FAIL: $label ($url)"
            return 1
          }

          check_url             "API health"             "https://api.diaglob.tech/health"             '"status"[[:space:]]*:[[:space:]]*"ok"'

          check_url             "API root"             "https://api.diaglob.tech/"             '"name"[[:space:]]*:[[:space:]]*"Diaglob API"'

          check_url "Frontend landing" "https://diaglob.tech/"
          check_url "Frontend login" "https://diaglob.tech/login"
          check_url "Frontend register" "https://diaglob.tech/register"
          check_url "Paid ecommerce landing" "https://diaglob.tech/ecommerce"
          check_url "Deep app route" "https://diaglob.tech/app/analytics"
          check_url "Growth deep app route" "https://diaglob.tech/app/growth"
          check_url "Unknown public route SPA fallback" "https://diaglob.tech/this-route-should-not-exist"
          check_url "Privacy policy" "https://diaglob.tech/privacy"
          check_url "Terms of service" "https://diaglob.tech/terms"
          check_url "Refund policy" "https://diaglob.tech/refund-policy"
          check_url "Shopify support center" "https://diaglob.tech/support"


      - name: Verify Block A protected API routes (anonymous, read only)
        shell: bash
        run: |
          set -euo pipefail

          # A 404 indicates a missing route; 200 indicates an auth bypass.
          # No credentials or application mutations are required.
          for route in /api/me /api/stores /api/conversations /api/agents /api/ai/workforce; do
            code="$(curl --silent --show-error --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              "https://api.diaglob.tech$route")"
            if [[ "$code" != "401" && "$code" != "403" ]]; then
              echo "FAIL: anonymous $route returned HTTP $code (expected 401/403)"
              exit 1
            fi
            echo "PASS: anonymous $route is registered and access-controlled (HTTP $code)"
          done

      - name: Verify billing onboarding public E2E boundaries (read only)
        shell: bash
        run: |
          set -euo pipefail

          # Public GET-only assertions after deploy. No Cognito accounts,
          # Shopify OAuth exchanges, Paddle charges, or merchant mutations.
          fetch_code() {
            curl --silent --show-error --max-time 15 \
              --output /dev/null --write-out '%{http_code}' "$1"
          }

          assert_code() {
            local expected="$1" url="$2" observed
            observed="$(fetch_code "$url")"
            if [[ "$observed" != "$expected" ]]; then
              echo "Unexpected HTTP response on $url: expected $expected, got $observed"
              return 1
            fi
            echo "PASS (HTTP $expected): $url"
          }

          assert_code 200 "https://diaglob.tech/register"
          assert_code 200 "https://diaglob.tech/shopify/install?shop=diaglob-poc.myshopify.com"

          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          status="$(curl --silent --show-error --max-time 15 \
            --dump-header "$headers" --output /dev/null \
            --write-out '%{http_code}' \
            'https://api.diaglob.tech/api/shopify/install?shop=diaglob-poc.myshopify.com')"
          # Public Shopify install is either explicitly unavailable (feature
          # not approved for this distribution), or starts OAuth at Shopify.
          # Never accept a pre-OAuth redirect into DIAGLOB login/store UI.
          if [[ "$status" == "503" ]]; then
            if grep -qi '^location:' "$headers"; then
              echo 'FAIL: disabled Shopify install unexpectedly redirected'
              exit 1
            fi
            echo 'PASS: public install disabled without pre-auth redirect'
          elif [[ "$status" == "303" ]]; then
            destination="$(grep -i '^location:' "$headers" | \
              tr -d '\r' | sed -E 's/^[^:]+:[[:space:]]*//')"
            if [[ "$destination" == "https://diaglob-poc.myshopify.com/admin/oauth/authorize?"* &&
                  "$destination" == *"state="* &&
                  "$destination" == *"client_id="* &&
                  "$destination" == *"redirect_uri="* ]]; then
              echo 'PASS: OAuth-first Shopify authorization redirect'
            else
              echo 'FAIL: public install did not redirect to Shopify OAuth'
              exit 1
            fi
          else
            echo "FAIL: unexpected Shopify install response HTTP $status"
            exit 1
          fi
          grep -qi '^cache-control: no-store' "$headers" || {
            echo 'Install response missing no-store'
            exit 1
          }
          echo 'PASS: safe Shopify install entry'

          assert_code 400 "https://api.diaglob.tech/api/shopify/install?shop=https%3A%2F%2Fevil.example.test"
          # These HTTP resources must NOT disclose tenant billing details
          # to anonymous visitors. Neither endpoint has write side effects.
          for route in /api/organization /api/billing/shopify/reconciliation-history /api/billing/shopify/development-probe; do
            status="$(fetch_code "https://api.diaglob.tech$route")"
            if [[ "$status" != "401" && "$status" != "403" ]]; then
              echo "FAIL: anonymous $route returned HTTP $status"
              exit 1
            fi
            echo "PASS: anonymous $route blocked (HTTP $status)"
          done


      - name: Verify all three Shopify GDPR topics reject invalid HMAC
        shell: bash
        run: |
          set -euo pipefail
          # Signed Shopify data must NEVER be fabricated on production here.
          # The three negative probes MUST short-circuit before DB writes.
          for topic in customers/data_request customers/redact shop/redact; do
            code="$(curl --silent --show-error --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              -X POST 'https://api.diaglob.tech/api/webhooks/shopify/compliance' \
              -H 'Content-Type: application/json' \
              -H "X-Shopify-Topic: $topic" \
              -H 'X-Shopify-Hmac-Sha256: invalid-hmac-test' \
              --data-binary '{"shop_id":0,"shop_domain":"never-valid.myshopify.com"}')"
            if [[ "$code" != "401" ]]; then
              echo "FAIL: $topic rejected with HTTP $code (expected 401)"
              exit 1
            fi
            echo "PASS: $topic rejects forged HMAC (HTTP 401)"
          done
          echo "NOTE: HMAC 401 does not prove app subscriptions or valid deliveries."

      - name: Audit Shopify privacy receipts on production (read only)
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/diaglob_actions_prod" \
            "$PROD_USER@$PROD_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          set -a
          . /etc/diaglob/diaglob.env
          set +a
          cd /opt/diaglob/app/backend
          .venv/bin/python -m app.shopify_privacy_operational_audit
          REMOTE
          # Read-only aggregate report: no PII, signed payloads or secrets.
          # A missing Shopify Partner token is reported, not interpreted as
          # evidence that a webhook subscription is absent in Shopify.

      - name: Audit Shopify Partner configuration on production (read only)
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/diaglob_actions_prod" \
            "$PROD_USER@$PROD_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          ENV_FILE=/etc/diaglob/diaglob.env
          if [[ ! -r "$ENV_FILE" ]]; then
            echo "SHOPIFY_BILLING_ENV_FILE_MISSING"
            exit 0
          fi
          set -a
          . "$ENV_FILE"
          set +a
          for key in SHOPIFY_PARTNER_ORG_ID SHOPIFY_PARTNER_APP_GID \
                     SHOPIFY_PARTNER_ACCESS_TOKEN SHOPIFY_APP_PRICING_HANDLES_JSON \
                     SHOPIFY_APP_STORE_HANDLE; do
            if [[ -n "${!key:-}" ]]; then
              echo "SHOPIFY_CONFIG_PRESENT: $key"
            else
              echo "SHOPIFY_CONFIG_MISSING: $key"
            fi
          done
          for key in SHOPIFY_BILLING_ENTITLEMENTS_ENABLED SHOPIFY_BILLING_SCHEDULER_ENABLED; do
            if [[ "${!key:-}" == "true" ]]; then
              echo "SHOPIFY_GATE_ON: $key"
            else
              echo "SHOPIFY_GATE_OFF: $key"
            fi
          done
          REMOTE

  notify:
    name: Telegram Notification
    needs:
      - validate
      - deploy
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Determine deployment status
        id: status
        shell: bash
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
            echo "status=VALIDATION FAILED" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
            echo "status=DEPLOY FAILED" >> "$GITHUB_OUTPUT"
          else
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
            echo "status=DEPLOY SUCCESSFUL" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_EMOJI: ${{ steps.status.outputs.emoji }}
          STATUS_TEXT: ${{ steps.status.outputs.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"

          MESSAGE="${STATUS_EMOJI} DIAGLOB — ${STATUS_TEXT}

          Repository: ${REPOSITORY}
          Branch: ${BRANCH}
          Commit: ${SHORT_SHA}
          Author: ${COMMIT_AUTHOR}

          ${COMMIT_MESSAGE}

          ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"

          curl --fail --silent --show-error \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
