name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: diaglob-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Ruff lint
        run: |
          cd backend
          ruff check app/ tests/

      - name: Backend tests
        run: |
          cd backend
          python -m pytest -q --tb=short

      - name: Frontend validation
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test
          npm run build

  deploy:
    name: Deploy DIAGLOB Production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY_B64: ${{ secrets.PROD_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$PROD_SSH_KEY_B64" | base64 --decode > ~/.ssh/diaglob_actions_prod
          chmod 600 ~/.ssh/diaglob_actions_prod

          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            "echo GITHUB_ACTIONS_SSH_OK"

      - name: Prepare production schema before restart
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          cd /opt/diaglob/app
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          cd backend
          .venv/bin/pip install -r requirements.txt
          REMOTE

          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            'sudo bash -s' <<'REMOTE'
          set -euo pipefail

          ENV_FILE=/etc/diaglob/diaglob.env

          if ! grep -q '^SUPPLIER_TOKEN_ENCRYPTION_KEY=' "$ENV_FILE"; then
            SUPPLIER_KEY="$(
              /opt/diaglob/app/backend/.venv/bin/python - <<'PY'
          from cryptography.fernet import Fernet
          print(Fernet.generate_key().decode("utf-8"))
          PY
            )"
            printf '\nSUPPLIER_TOKEN_ENCRYPTION_KEY=%s\n' "$SUPPLIER_KEY" >> "$ENV_FILE"
          fi

          set -a
          . "$ENV_FILE"
          set +a

          cd /opt/diaglob/app/backend
          .venv/bin/alembic upgrade heads
          .venv/bin/alembic current
          REMOTE

      - name: Deploy DIAGLOB
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        shell: bash
        run: |
          set -euo pipefail

          set +e
          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            "/opt/diaglob/scripts/deploy.sh"
          deploy_status=$?
          set -e

          if [[ "$deploy_status" -eq 0 ]]; then
            exit 0
          fi

          # deploy.sh currently performs its own immediate curl --fail health
          # check after restarting the API. curl exit 22 means the HTTP
          # endpoint answered with an error (typically a brief 502 while
          # systemd/Uvicorn is still warming up). Only that exact exit code is
          # eligible for recovery; every other deploy failure remains fatal.
          if [[ "$deploy_status" -ne 22 ]]; then
            echo "deploy.sh failed with non-health exit code: $deploy_status"
            exit "$deploy_status"
          fi

          echo "deploy.sh returned curl exit 22; checking for API recovery..."

          for attempt in {1..12}; do
            body="$(mktemp)"

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 15 \
              https://api.diaglob.tech/health \
              --output "$body"; then
              if grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' "$body"; then
                echo "API recovered after transient deploy health failure."
                rm -f "$body"
                exit 0
              fi
            fi

            rm -f "$body"
            echo "Recovery check ${attempt}/12 failed; retrying in 5 seconds..."
            sleep 5
          done

          echo "API did not recover after deploy.sh exit 22."
          exit "$deploy_status"

      - name: Migrate production database
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          set -a
          . /etc/diaglob/diaglob.env
          set +a

          cd /opt/diaglob/app/backend
          .venv/bin/alembic upgrade heads
          .venv/bin/alembic current

          systemctl restart diaglob-api
          REMOTE

      - name: Verify production smoke surfaces
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local label="$1"
            local url="$2"
            local pattern="${3:-}"

            for attempt in {1..12}; do
              body="$(mktemp)"

              if curl                 --fail                 --location                 --silent                 --show-error                 --max-time 15                 "$url"                 --output "$body"; then
                if [[ -z "$pattern" ]] || grep -Eq "$pattern" "$body"; then
                  echo "PASS: $label ($url)"
                  rm -f "$body"
                  return 0
                fi
              fi

              rm -f "$body"
              echo "Smoke check '$label' attempt ${attempt}/12 failed; retrying in 5 seconds..."
              sleep 5
            done

            echo "FAIL: $label ($url)"
            return 1
          }

          check_url             "API health"             "https://api.diaglob.tech/health"             '"status"[[:space:]]*:[[:space:]]*"ok"'

          check_url             "API root"             "https://api.diaglob.tech/"             '"name"[[:space:]]*:[[:space:]]*"Diaglob API"'

          check_url "Frontend landing" "https://diaglob.tech/"
          check_url "Frontend login" "https://diaglob.tech/login"
          check_url "Frontend register" "https://diaglob.tech/register"
          check_url "Paid ecommerce landing" "https://diaglob.tech/ecommerce"
          check_url "Deep app route" "https://diaglob.tech/app/analytics"
          check_url "Growth deep app route" "https://diaglob.tech/app/growth"
          check_url "Unknown public route SPA fallback" "https://diaglob.tech/this-route-should-not-exist"
          check_url "Privacy policy" "https://diaglob.tech/privacy"
          check_url "Terms of service" "https://diaglob.tech/terms"
          check_url "Refund policy" "https://diaglob.tech/refund-policy"
          check_url "Shopify support center" "https://diaglob.tech/support"


      - name: Verify Block A protected API routes (anonymous, read only)
        shell: bash
        run: |
          set -euo pipefail

          # A 404 indicates a missing route; 200 indicates an auth bypass.
          # No credentials or application mutations are required.
          for route in /api/me /api/stores /api/conversations /api/agents /api/ai/workforce; do
            code="$(curl --silent --show-error --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              "https://api.diaglob.tech$route")"
            if [[ "$code" != "401" && "$code" != "403" ]]; then
              echo "FAIL: anonymous $route returned HTTP $code (expected 401/403)"
              exit 1
            fi
            echo "PASS: anonymous $route is registered and access-controlled (HTTP $code)"
          done

      - name: Verify billing onboarding public E2E boundaries (read only)
        shell: bash
        run: |
          set -euo pipefail

          # Public GET-only assertions after deploy. No Cognito accounts,
          # Shopify OAuth exchanges, Paddle charges, or merchant mutations.
          fetch_code() {
            curl --silent --show-error --max-time 15 \
              --output /dev/null --write-out '%{http_code}' "$1"
          }

          assert_code() {
            local expected="$1" url="$2" observed
            observed="$(fetch_code "$url")"
            if [[ "$observed" != "$expected" ]]; then
              echo "Unexpected HTTP response on $url: expected $expected, got $observed"
              return 1
            fi
            echo "PASS (HTTP $expected): $url"
          }

          assert_code 200 "https://diaglob.tech/register"
          assert_code 200 "https://diaglob.tech/shopify/install?shop=diaglob-poc.myshopify.com"

          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          status="$(curl --silent --show-error --max-time 15 \
            --dump-header "$headers" --output /dev/null \
            --write-out '%{http_code}' \
            'https://api.diaglob.tech/api/shopify/install?shop=diaglob-poc.myshopify.com')"
          [[ "$status" == "303" ]] || { echo "Install handoff HTTP $status (wanted 303)"; exit 1; }

          destination="$(grep -i '^location:' "$headers" | \
            tr -d '\r' | sed -E 's/^[^:]+:[[:space:]]*//')"
          if [[ "$destination" == 'https://diaglob.tech/shopify/install?shop=diaglob-poc.myshopify.com' ]]; then
            echo 'PASS: legacy install handoff (OAuth-first feature remains OFF)'
          elif [[ "$destination" == "https://diaglob-poc.myshopify.com/admin/oauth/authorize?"* &&
                  "$destination" == *"state="* &&
                  "$destination" == *"client_id="* &&
                  "$destination" == *"redirect_uri="* ]]; then
            echo 'PASS: OAuth-first Shopify authorization redirect'
          else
            echo 'FAIL: install handoff destination was not an approved HTTPS route'
            exit 1
          fi
          grep -qi '^cache-control: no-store' "$headers" || {
            echo 'Install handoff missing no-store'
            exit 1
          }
          echo 'PASS: safe Shopify install 303 handoff'

          assert_code 400 "https://api.diaglob.tech/api/shopify/install?shop=https%3A%2F%2Fevil.example.test"
          # These HTTP resources must NOT disclose tenant billing details
          # to anonymous visitors. Neither endpoint has write side effects.
          for route in /api/organization /api/billing/shopify/reconciliation-history /api/billing/shopify/development-probe; do
            status="$(fetch_code "https://api.diaglob.tech$route")"
            if [[ "$status" != "401" && "$status" != "403" ]]; then
              echo "FAIL: anonymous $route returned HTTP $status"
              exit 1
            fi
            echo "PASS: anonymous $route blocked (HTTP $status)"
          done


      - name: Verify Shopify mandatory privacy webhook rejects invalid HMAC
        shell: bash
        run: |
          set -euo pipefail
          # This is deliberately an INVALID Shopify signature. Application
          # code must reject it before parsing or writing any private data.
          # Do not send a valid signed GDPR webhook from deployment CI.
          code="$(curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out '%{http_code}' \
            -X POST 'https://api.diaglob.tech/api/webhooks/shopify/compliance' \
            -H 'Content-Type: application/json' \
            -H 'X-Shopify-Topic: customers/redact' \
            -H 'X-Shopify-Hmac-Sha256: invalid-hmac-test' \
            --data-binary '{"shop_id":0,"shop_domain":"never-valid.myshopify.com"}')"
          if [[ "$code" != "401" ]]; then
            echo "FAIL: Shopify compliance webhook returned HTTP $code instead of 401"
            exit 1
          fi
          echo 'PASS: Shopify mandatory compliance webhook is deployed and denies bad signatures (401)'
          # This proves receiver/HMAC rejection only. App-level subscription
          # and actual export/redaction are still NOT verified.

      - name: Audit Shopify Partner configuration on production (read only)
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/diaglob_actions_prod" \
            "$PROD_USER@$PROD_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          ENV_FILE=/etc/diaglob/diaglob.env
          if [[ ! -r "$ENV_FILE" ]]; then
            echo "SHOPIFY_BILLING_ENV_FILE_MISSING"
            exit 0
          fi
          set -a
          . "$ENV_FILE"
          set +a
          for key in SHOPIFY_PARTNER_ORG_ID SHOPIFY_PARTNER_APP_GID \
                     SHOPIFY_PARTNER_ACCESS_TOKEN SHOPIFY_APP_PRICING_HANDLES_JSON \
                     SHOPIFY_APP_STORE_HANDLE; do
            if [[ -n "${!key:-}" ]]; then
              echo "SHOPIFY_CONFIG_PRESENT: $key"
            else
              echo "SHOPIFY_CONFIG_MISSING: $key"
            fi
          done
          for key in SHOPIFY_BILLING_ENTITLEMENTS_ENABLED SHOPIFY_BILLING_SCHEDULER_ENABLED; do
            if [[ "${!key:-}" == "true" ]]; then
              echo "SHOPIFY_GATE_ON: $key"
            else
              echo "SHOPIFY_GATE_OFF: $key"
            fi
          done
          REMOTE

  notify:
    name: Telegram Notification
    needs:
      - validate
      - deploy
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Determine deployment status
        id: status
        shell: bash
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
            echo "status=VALIDATION FAILED" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
            echo "status=DEPLOY FAILED" >> "$GITHUB_OUTPUT"
          else
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
            echo "status=DEPLOY SUCCESSFUL" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_EMOJI: ${{ steps.status.outputs.emoji }}
          STATUS_TEXT: ${{ steps.status.outputs.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"

          MESSAGE="${STATUS_EMOJI} DIAGLOB — ${STATUS_TEXT}

          Repository: ${REPOSITORY}
          Branch: ${BRANCH}
          Commit: ${SHORT_SHA}
          Author: ${COMMIT_AUTHOR}

          ${COMMIT_MESSAGE}

          ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"

          curl --fail --silent --show-error \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
