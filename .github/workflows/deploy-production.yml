name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: diaglob-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Ruff lint
        run: |
          cd backend
          ruff check app/ tests/

      - name: Backend tests
        run: |
          cd backend
          python -m pytest -q --tb=short

      - name: Frontend validation
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test
          npm run build

  deploy:
    name: Deploy DIAGLOB Production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY_B64: ${{ secrets.PROD_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$PROD_SSH_KEY_B64" | base64 --decode > ~/.ssh/diaglob_actions_prod
          chmod 600 ~/.ssh/diaglob_actions_prod

          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            "echo GITHUB_ACTIONS_SSH_OK"

      - name: Prepare production schema before restart
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          cd /opt/diaglob/app
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          cd backend
          .venv/bin/pip install -r requirements.txt
          REMOTE

          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            'sudo bash -s' <<'REMOTE'
          set -euo pipefail

          ENV_FILE=/etc/diaglob/diaglob.env

          if ! grep -q '^SUPPLIER_TOKEN_ENCRYPTION_KEY=' "$ENV_FILE"; then
            SUPPLIER_KEY="$(
              /opt/diaglob/app/backend/.venv/bin/python - <<'PY'
          from cryptography.fernet import Fernet
          print(Fernet.generate_key().decode("utf-8"))
          PY
            )"
            printf '\nSUPPLIER_TOKEN_ENCRYPTION_KEY=%s\n' "$SUPPLIER_KEY" >> "$ENV_FILE"
          fi

          set -a
          . "$ENV_FILE"
          set +a

          cd /opt/diaglob/app/backend
          .venv/bin/alembic upgrade heads
          .venv/bin/alembic current
          REMOTE

      - name: Deploy DIAGLOB
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        shell: bash
        run: |
          set -euo pipefail

          set +e
          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            "/opt/diaglob/scripts/deploy.sh"
          deploy_status=$?
          set -e

          if [[ "$deploy_status" -eq 0 ]]; then
            exit 0
          fi

          # deploy.sh currently performs its own immediate curl --fail health
          # check after restarting the API. curl exit 22 means the HTTP
          # endpoint answered with an error (typically a brief 502 while
          # systemd/Uvicorn is still warming up). Only that exact exit code is
          # eligible for recovery; every other deploy failure remains fatal.
          if [[ "$deploy_status" -ne 22 ]]; then
            echo "deploy.sh failed with non-health exit code: $deploy_status"
            exit "$deploy_status"
          fi

          echo "deploy.sh returned curl exit 22; checking for API recovery..."

          for attempt in {1..12}; do
            body="$(mktemp)"

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 15 \
              https://api.diaglob.tech/health \
              --output "$body"; then
              if grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' "$body"; then
                echo "API recovered after transient deploy health failure."
                rm -f "$body"
                exit 0
              fi
            fi

            rm -f "$body"
            echo "Recovery check ${attempt}/12 failed; retrying in 5 seconds..."
            sleep 5
          done

          echo "API did not recover after deploy.sh exit 22."
          exit "$deploy_status"

      - name: Migrate production database
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh \
            -i ~/.ssh/diaglob_actions_prod \
            "$PROD_USER@$PROD_HOST" \
            'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          set -a
          . /etc/diaglob/diaglob.env
          set +a

          cd /opt/diaglob/app/backend
          .venv/bin/alembic upgrade heads
          .venv/bin/alembic current

          systemctl restart diaglob-api
          REMOTE

      - name: Verify production smoke surfaces
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local label="$1"
            local url="$2"
            local pattern="${3:-}"

            for attempt in {1..12}; do
              body="$(mktemp)"

              if curl                 --fail                 --location                 --silent                 --show-error                 --max-time 15                 "$url"                 --output "$body"; then
                if [[ -z "$pattern" ]] || grep -Eq "$pattern" "$body"; then
                  echo "PASS: $label ($url)"
                  rm -f "$body"
                  return 0
                fi
              fi

              rm -f "$body"
              echo "Smoke check '$label' attempt ${attempt}/12 failed; retrying in 5 seconds..."
              sleep 5
            done

            echo "FAIL: $label ($url)"
            return 1
          }

          check_url             "API health"             "https://api.diaglob.tech/health"             '"status"[[:space:]]*:[[:space:]]*"ok"'

          check_url             "API root"             "https://api.diaglob.tech/"             '"name"[[:space:]]*:[[:space:]]*"Diaglob API"'

          check_url "Frontend landing" "https://diaglob.tech/"
          check_url "Frontend login" "https://diaglob.tech/login"
          check_url "Frontend register" "https://diaglob.tech/register"
          check_url "Paid ecommerce landing" "https://diaglob.tech/ecommerce"
          check_url "Privacy policy" "https://diaglob.tech/privacy"
          check_url "Terms of service" "https://diaglob.tech/terms"
          check_url "Refund policy" "https://diaglob.tech/refund-policy"

  notify:
    name: Telegram Notification
    needs:
      - validate
      - deploy
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Determine deployment status
        id: status
        shell: bash
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
            echo "status=VALIDATION FAILED" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
            echo "status=DEPLOY FAILED" >> "$GITHUB_OUTPUT"
          else
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
            echo "status=DEPLOY SUCCESSFUL" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_EMOJI: ${{ steps.status.outputs.emoji }}
          STATUS_TEXT: ${{ steps.status.outputs.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"

          MESSAGE="${STATUS_EMOJI} DIAGLOB — ${STATUS_TEXT}

          Repository: ${REPOSITORY}
          Branch: ${BRANCH}
          Commit: ${SHORT_SHA}
          Author: ${COMMIT_AUTHOR}

          ${COMMIT_MESSAGE}

          ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"

          curl --fail --silent --show-error \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
