name: WhatsApp DB Cleanup Green

on:
  push:
    branches:
      - perf/whatsapp-db-cleanup
    paths:
      - .github/workflows/whatsapp-db-cleanup-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/whatsapp-db-cleanup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Apply WhatsApp fixture refactor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/test_whatsapp.py')
          text = path.read_text(encoding='utf-8')
          old = '''@pytest.fixture(autouse=True)\ndef setup_db():\n    Base.metadata.create_all(bind=engine)\n    yield\n    Base.metadata.drop_all(bind=engine)\n\n\n@pytest.fixture()\ndef db():\n'''
          new = '''@pytest.fixture(scope="module", autouse=True)\ndef setup_db():\n    Base.metadata.drop_all(bind=engine)\n    Base.metadata.create_all(bind=engine)\n    yield\n    Base.metadata.drop_all(bind=engine)\n\n\n@pytest.fixture(autouse=True)\ndef cleanup_db(setup_db):\n    yield\n    with engine.begin() as connection:\n        for table in reversed(Base.metadata.sorted_tables):\n            connection.execute(table.delete())\n\n\n@pytest.fixture()\ndef db():\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected fixture block exactly once, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Focused GREEN and timing collection
        working-directory: backend
        run: |
          python -m pytest -q --tb=short \
            tests/test_ci_db_fixture_scope.py \
            tests/test_whatsapp.py \
            -p tools.test_timings \
            --timings-output /tmp/whatsapp-timings.json
          cat /tmp/whatsapp-timings.json

      - name: Refresh WhatsApp historical timing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          measured = json.loads(Path('/tmp/whatsapp-timings.json').read_text())
          key = 'tests/test_whatsapp.py'
          if key not in measured:
              raise SystemExit(f'{key} missing from timing collector output')

          path = Path('backend/test_timings.json')
          timings = json.loads(path.read_text())
          old = timings[key]
          timings[key] = measured[key]
          path.write_text(json.dumps(timings, indent=2, sort_keys=True) + '\n')
          print(f'{key}: {old:.6f}s -> {timings[key]:.6f}s')
          PY

      - name: Verify focused diff
        run: |
          ruff check backend/tests/test_whatsapp.py backend/tests/test_ci_db_fixture_scope.py backend/tools/test_timings.py
          git diff --check
          git diff -- backend/tests/test_whatsapp.py backend/test_timings.json

      - name: Commit GREEN implementation
        run: |
          git config user.name "Adrian Felipe Guerra"
          git config user.email "adrianguerra9703@gmail.com"
          git add backend/tests/test_whatsapp.py backend/test_timings.json
          git commit -m "perf: reuse DB schema in WhatsApp tests"
          git push origin HEAD:perf/whatsapp-db-cleanup
