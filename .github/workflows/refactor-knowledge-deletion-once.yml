name: One-off Knowledge Deletion Orchestrator Refactor

on:
  push:
    branches:
      - refactor/knowledge-deletion-orchestrator
    paths:
      - .github/workflows/refactor-knowledge-deletion-once.yml

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delegate deletion orchestration
        run: python3 scripts/refactor_knowledge_deletion_once.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/bedrock_knowledge_base.py
          git diff --cached --quiet && exit 0
          git commit -m "refactor: delegate knowledge deletion orchestration"
          git push origin HEAD:${GITHUB_REF_NAME}
