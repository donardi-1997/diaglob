# OPTIONAL SYSTEMD DROP-IN. NOT INSTALLED BY GIT DEPLOY.
# Review/enable only after external WORM bucket, signed ledger, IAM and
# staged restore tests are approved. Fail closed on a recovered stale DB.
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
EnvironmentFile=/etc/diaglob/diaglob.env
ExecStartPre=/usr/bin/env PYTHONPATH=/opt/diaglob/app/backend /opt/diaglob/app/backend/.venv/bin/python -m tools.shopify_privacy_startup_guard
